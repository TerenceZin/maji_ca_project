server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — toutes les routes React sont servies par index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long terme pour les assets versionnés par Vite (hash dans le nom de fichier)
    location ~* \.(js|css|woff2?|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
